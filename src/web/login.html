<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Monitor · Acceder</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>Web Monitor</h1>
      <p class="muted" style="margin-top:0">Panel de monitorización de webs</p>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" type="submit" style="width:100%">Entrar</button>
      <div class="error-text" id="login-error" hidden></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) { window.location.href = '/'; return; }
      errorBox.textContent = data.error || 'No se pudo iniciar sesión';
      errorBox.hidden = false;
    });
  </script>
</body>
</html>
